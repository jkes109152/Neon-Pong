name: 發布 NEON ARENA 至 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: 建立並發布靜態遊戲
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 取得程式碼
        uses: actions/checkout@v4
      - name: 設定 GitHub Pages
        uses: actions/configure-pages@v5
      - name: 上傳 Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: 發布至 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
